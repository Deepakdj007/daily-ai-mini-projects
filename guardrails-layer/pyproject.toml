[project]
name = "guardrails-layer"
version = "0.1.0"
description = "A layered guardrail for prompt injection and PII leaks, with the false-positive measurement most demos skip"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "groq>=1.6.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
