[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "A tool-calling agent that lives in Telegram: web search, reminders, notes, link/PDF summaries, and an unprompted morning briefing, on free Groq + LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.14.4",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[job-queue]>=22.8",
    "trafilatura>=2.1.0",
    "youtube-transcript-api>=1.2.4",
]
