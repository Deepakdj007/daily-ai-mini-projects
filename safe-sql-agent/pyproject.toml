[project]
name = "safe-sql-agent"
version = "0.1.0"
description = "Chat with a SQL database in English, where a sqlglot AST guard, a read-only connection and a SQLite authorizer decide what runs — not the prompt. LangGraph on Groq's free tier."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
    "rich>=14.0.0",
    "sqlglot>=30.15.0",
]
