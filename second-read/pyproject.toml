[project]
name = "second-read"
version = "0.1.0"
description = "A local case workstation on MedGemma 1.5 that re-tests every claim it makes with the evidence deleted"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "nibabel>=5.4.2",
    "numpy>=2.5.3",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
]
