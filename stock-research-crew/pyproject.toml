[project]
name = "stock-research-crew"
version = "0.1.0"
description = "Parallel multi-agent equity research on CrewAI: four analysts study one stock at once, an editor writes the note."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai[google-genai]>=1.15.10",
    "pandas>=2.2",
    "python-dotenv>=1.2.2",
    "rich>=13",
    "yfinance>=1.5.2",
]
